<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Horizon Tree</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #treeCanvas {
            background-color: #000000;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
        }
    </style>
</head>
<body>
    <canvas id="treeCanvas" width="800" height="600"></canvas>
    <script>
        (function () {
            'use strict';
            var canvas = document.getElementById('treeCanvas');
            var ctx = canvas.getContext('2d');
            
            var colors = {
                cyan: '#00e5ff',
                pink: '#ff007f',
                orange: '#ff6600'
            };
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        })();
                (function () {
            'use strict';
            var canvas = document.getElementById('treeCanvas');
            var ctx = canvas.getContext('2d');
            
            var colors = ['#00e5ff', '#ff007f', '#ff6600'];
            
            function generateInfiniteBranch(startX, startY, currentLength, currentAngle, generationDepth) {
                if (generationDepth > 10) return;
                
                var endX = startX + Math.cos(currentAngle) * currentLength;
                var endY = startY + Math.sin(currentAngle) * currentLength;
                
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = colors[generationDepth % colors.length];
                ctx.lineWidth = Math.max(1, 8 - generationDepth);
                ctx.stroke();
                ctx.closePath();
                
                var nextLength = currentLength * 0.75;
                var spreadAngle = 0.45;
                
                generateInfiniteBranch(endX, endY, nextLength, currentAngle - spreadAngle, generationDepth + 1);
                generateInfiniteBranch(endX, endY, nextLength, currentAngle + spreadAngle, generationDepth + 1);
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            generateInfiniteBranch(400, 550, 130, -Math.PI / 2, 0);
        })();
    </script>
</body>
</html>
